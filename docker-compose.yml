services:
  maschinenplan:
    build: .
    image: maschinenplan:latest
    container_name: maschinenplan
    restart: unless-stopped                # auto-start after crash or server reboot
    # Bind only to localhost — nginx (TLS) proxies to it. Change to "3000:3000"
    # only if you deliberately expose it without a reverse proxy.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - data:/data                          # DB + backups live here, survive image updates
    environment:
      - PORT=3000
      - DB_PATH=/data/buchungen.db
      - IMPORT_JSON=/data/buchungen.json    # first run: seeds the DB if present
      - BACKUP_DIR=/data/backups
      - BACKUP_KEEP=30
    # --- hardening ---
    read_only: true                         # root filesystem is read-only …
    tmpfs:
      - /tmp                                 # … only /tmp and the /data volume are writable
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  data:
