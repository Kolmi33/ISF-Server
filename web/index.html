<!DOCTYPE html>
<!--
=============================================================================
 MASCHINENBELEGUNG ISF — Single-File-Webapp
=============================================================================
 ZWECK
   Buchungsplan für Maschinen/Messtechnik (Bereiche, Kategorien). Ersetzt die
   frühere Excel-Liste. SERVER-VARIANTE: Die App wird vom Node/SQLite-Server
   ausgeliefert und spricht per HTTP + Server-Sent-Events mit ihm.

 SERVER-SCHNITTSTELLE (Node-Backend, siehe ../src/)
   GET  /api/state    – kompletter Stand { rev, groups, machines, bookings }
   POST /api/mutate   – Zell-Delta (prev+val, Compare-and-Set) ODER komplette
                        Maschinen-/Gruppenliste (Verwalten)
   GET  /api/stream   – Live-Push (SSE): update {rev,changes} · presence {n,users}
   Daten + tägliche Sicherungen liegen serverseitig (SQLite-Datei im Volume).

 DATENMODELL (buchungen.json)
   {
     version: 1,
     revision:<n>,                                       // wird bei JEDEM Schreiben +1 (Concurrency)
     meta:    { title, created, source },
     groups:  [ Bereichsnamen ],
     machines:[ { id, name, group, info,
                  status:'ok'|'wartung'|'defekt',       // Sperre …
                  statusNote, statusFrom, statusUntil } // … optional zeitbegrenzt
              ],
     bookings:{ <maschinenId>: { 'JJJJ-MM-TT': { name, note?, ts } } },
     log:     [ { ts, user, action } ]                  // neueste zuerst, max. 500
   }

 ARCHITEKTUR / DATENFLUSS
   - Läuft in jedem modernen Browser (kein lokaler Dateizugriff nötig).
   - JEDE Datenänderung läuft durch mutate() → persist(): optimistisch sofort
     anzeigen, dann POST /api/mutate an den Server. Der Server serialisiert die
     Schreibvorgänge (SQLite) und meldet Konflikte zurück (Compare-and-Set).
   - Anzeige: der Server SCHIEBT Änderungen per SSE an alle Clients (connectSSE);
     kein Polling. refreshNow() = manueller Voll-Abgleich (🔄).
   - Die alte Datei-Schicht ist entfernt; der BACKEND-ADAPTER am Skriptende
     definiert readFile/persist/refreshNow/startLiveTimers/… als HTTP+SSE.

 UI-EINSTIEGSPUNKTE (Funktionsnamen zum Suchen)
   render()                        Raster (Kopf, Bereiche, Zellen)
   Sel / paintSel() / showCtx()    Auswahl: Ziehen, Shift+Klick, Pfeiltasten
   openBookingForm/submitBooking   Buchen inkl. Konflikte + Undo
   openBookingDetail               Buchung ansehen/löschen (Serien-Erkennung)
   openAssistant/runAssistant      gemeinsame freie Termine mehrerer Maschinen
   openMyBookings                  eigene Buchungen (Serienstruktur eingefroren)
   openAllBookings                 alle Buchungen, tabellarisch mit Filtern
   openStats                       Statistik Maschinen ⇄ Personen, Drilldown
   openAdmin/openMachineForm       Maschinenverwaltung + Änderungsprotokoll
   openSettings                    Theme, Präsenz, Ansicht, Name, Debug …
   gotoNextFree/gotoPrevFree       ⏭/⏮-Sprünge zum (nächsten) freien Termin
   connectSSE/applyPresence        Live-Verbindung + Anwesenheit (per SSE)
   dbg()/applyDebug()              Debug-Panel (Einstellungen → Debug)

 KONVENTIONEN
   - Datumswerte: intern Date auf UTC-Mitternacht, gespeichert/verglichen als
     ISO-String 'JJJJ-MM-TT' (Strings sortieren chronologisch korrekt).
   - Nur Werktage Mo–Fr; Wochenenden existieren im Raster nicht.
   - Namensvergleiche immer case-insensitiv (toLowerCase()).
   - Jede HTML-Ausgabe von Nutzdaten durch esc() schicken (XSS-Schutz).
   - Gerätebezogen = localStorage (Schlüssel mit Präfix mb_: user, theme,
     presence, compact, weekends, debug, favs, collapsed, machw);
     teamweit = Server (SQLite).

 ERWEITERN — CHECKLISTE
   1) Aktion, die Daten ändert: IMMER über mutate(); Undo via offerUndo().
   2) Neue Ansicht: eigenes Modal über openModal(), nicht in render() mischen.
   3) Neue Einstellung: openSettings() + localStorage + sofort anwenden.
   4) Versionsmarke am Dateiende hochzählen (/* vX.Y */).
=============================================================================
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maschinenbelegung ISF</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- Icon-Sprite: schlichter 13-px-Strichsatz, ersetzt das frühere Emoji-System -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-factory" viewBox="0 0 16 16"><path d="M2 13.5V8.5l3-2v2l3-2v2l3-2V4.5h3v9z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 16 16"><path d="M9 1.5 4 9h3.2l-1 5.5L12 7H8.3z"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 16 16"><path d="M2.5 12a5.5 5.5 0 1 1 11 0"/><path d="M8 12 10.8 7.2"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.7-3.75M13 2.5V5h-2.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 16 16"><circle cx="8" cy="5.2" r="2.6"/><path d="M2.8 13.5a5.2 5.2 0 0 1 10.4 0"/></symbol>
  <symbol id="i-compass" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M10.5 5.5 9.2 9.2 5.5 10.5l1.3-3.7z"/></symbol>
  <symbol id="i-clip" viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="9" height="11.5" rx="1"/><path d="M6 6.5h4M6 9h4M6 11.5h2.5"/></symbol>
  <symbol id="i-table" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1"/><path d="M2.5 6.5h11M2.5 9.75h11M6.5 6.5V13"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4"/><path d="m10.2 10.2 3.3 3.3"/></symbol>
  <symbol id="i-chart" viewBox="0 0 16 16"><path d="M3.5 13V9M7.5 13V4.5M11.5 13V7M2 13.5h12"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 16 16"><path d="M11.5 2.5a3 3 0 0 0-2.9 3.8L3 11.9a1.6 1.6 0 1 0 2.3 2.3l5.6-5.6a3 3 0 0 0 3.6-4.1L12.3 6.7l-2-.5-.5-2z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6 5 5M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16"><path d="M4 3.5 10 8l-6 4.5zM12 3.5v9"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16"><path d="M12 3.5 6 8l6 4.5zM4 3.5v9"/></symbol>
  <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.2V11M8 5.1v.2"/></symbol>

<div id="startScreen">
  <div class="card">
    <h1>Maschinenbelegung ISF</h1>
    <p id="startMsg">Verbinde mit dem Server…</p>
  </div>
</div>

<header style="display:none" id="toolbar">
  <div class="htitle">
    <h1><svg class="ic" aria-hidden="true"><use href="#i-factory"/></svg> Maschinenbelegung</h1>
  </div>
  <div class="l1">
    <div class="navgroup">
      <button class="btn" id="btnPrev" title="Vorherige Woche">◀</button>
      <button class="btn primary" id="btnToday">Heute</button>
      <button class="btn" id="btnNext" title="Nächste Woche">▶</button>
      <select id="jumpMonth" title="Zu Monat springen">
        <option value="0">Januar</option><option value="1">Februar</option><option value="2">März</option>
        <option value="3">April</option><option value="4">Mai</option><option value="5">Juni</option>
        <option value="6">Juli</option><option value="7">August</option><option value="8">September</option>
        <option value="9">Oktober</option><option value="10">November</option><option value="11">Dezember</option>
      </select>
      <input type="number" id="jumpYear" min="20" max="99" style="width:52px" title="Jahr (zweistellig, z. B. 26 = 2026)">
    </div>
    <div id="groupWrap" style="display:none">
      <button class="btn" id="groupBtn">Alle Bereiche ▾</button>
      <button class="btn small clearx" id="groupClearBtn" title="Filter entfernen" aria-label="Filter entfernen" style="display:none">×</button>
      <div id="groupDrop"></div>
    </div>
  </div>
  <div class="r1">
    <button class="btn small" id="btnRefresh" title="Jetzt neu laden (Zeit = letzter Datenabgleich)" aria-label="Jetzt neu laden"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg> <span id="lastRef">–</span></button>
    <button class="btn" id="userChip" title="Namen ändern" aria-label="Namen ändern">–</button>
  </div>
  <div class="l2">
    <button class="btn" id="btnAssist"><svg class="ic" aria-hidden="true"><use href="#i-compass"/></svg> Assistent</button>
    <button class="btn" id="btnMine"><svg class="ic" aria-hidden="true"><use href="#i-clip"/></svg> Meine Buchungen</button>
    <button class="btn" id="btnAll"><svg class="ic" aria-hidden="true"><use href="#i-table"/></svg> Alle Buchungen</button>
    <div id="machWrap">
      <button class="btn" id="machBtn"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg> Filtern ▾</button>
      <button class="btn small clearx" id="machClearBtn" title="Filter entfernen" aria-label="Filter entfernen" style="display:none">×</button>
      <div id="machDrop"></div>
    </div>
  </div>
  <div class="r2">
    <button class="btn" id="btnStats"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg> Statistik</button>
    <button class="btn" id="btnAdmin"><svg class="ic" aria-hidden="true"><use href="#i-wrench"/></svg> Verwalten</button>
    <button class="btn" id="btnSettings"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg> Einstellungen</button>
    <button class="btn" id="btnHelp" title="Legende und Tastaturkürzel" aria-label="Hilfe"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg></button>
  </div>
</header>

<div id="collBanner" role="alert">
  <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>
  <span>Gleichzeitiger Schreibzugriff erkannt – der Plan wurde soeben mit dem Stand der Kollegen neu geladen. Bitte letzte Aktion prüfen.</span>
  <span class="spacer"></span>
  <button class="btn small" id="collOk">Verstanden</button>
</div>
<div id="gridWrap" style="display:none" tabindex="0" role="application"
  aria-label="Belegungsraster: Pfeiltasten navigieren, Shift erweitert die Auswahl, Enter öffnet, Escape hebt auf">
  <table id="grid" role="grid" aria-label="Belegungsraster"><thead></thead><tbody></tbody></table></div>

<div id="overlay"><div id="modal" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<button id="modalReopen" title="Assistent wieder aufklappen" aria-label="Assistent wieder aufklappen"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg><span>Assistent</span></button>
<div id="asTip" role="status" aria-live="polite"></div>
<div id="confirm2" role="dialog" aria-modal="true">
  <div class="cbox">
    <h3 id="cfTitle"></h3>
    <div id="cfBody" style="font-size:13px"></div>
    <div class="modal-actions">
      <button class="btn" id="cfNo">Abbrechen</button>
      <button class="btn dangerfill" id="cfYes">Löschen</button>
    </div>
  </div>
</div>
<div id="ctxMenu"></div>
<div id="dbgPanel">
  <div id="dbgHead"><svg class="ic" aria-hidden="true"><use href="#i-bug"/></svg> Debug
    <span class="spacer"></span>
    <button class="btn small" id="dbgClear">Leeren</button>
    <button class="btn small" id="dbgClose" title="Debug-Modus ausschalten">✕</button>
  </div>
  <div id="dbgList"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/js/app.ts"></script>
</body>
</html>
