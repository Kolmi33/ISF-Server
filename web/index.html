<!DOCTYPE html>
<!--
=============================================================================
 MASCHINENBELEGUNG ISF — Single-File-Webapp
=============================================================================
 ZWECK
   Buchungsplan für Maschinen/Messtechnik (Bereiche, Kategorien). Ersetzt die
   frühere Excel-Liste. SERVER-VARIANTE: Die App wird vom Node/SQLite-Server
   ausgeliefert und spricht per HTTP + Server-Sent-Events mit ihm.

 SERVER-SCHNITTSTELLE (Node-Backend, siehe ../src/)
   GET  /api/state    – kompletter Stand { rev, groups, machines, bookings }
   POST /api/mutate   – Zell-Delta (prev+val, Compare-and-Set) ODER komplette
                        Maschinen-/Gruppenliste (Verwalten)
   GET  /api/stream   – Live-Push (SSE): update {rev,changes} · presence {n,users}
   Daten + tägliche Sicherungen liegen serverseitig (SQLite-Datei im Volume).

 DATENMODELL (buchungen.json)
   {
     version: 1,
     revision:<n>,                                       // wird bei JEDEM Schreiben +1 (Concurrency)
     meta:    { title, created, source },
     groups:  [ Bereichsnamen ],
     machines:[ { id, name, group, info,
                  status:'ok'|'wartung'|'defekt',       // Sperre …
                  statusNote, statusFrom, statusUntil } // … optional zeitbegrenzt
              ],
     bookings:{ <maschinenId>: { 'JJJJ-MM-TT': { name, note?, ts } } },
     log:     [ { ts, user, action } ]                  // neueste zuerst, max. 500
   }

 ARCHITEKTUR / DATENFLUSS
   - Läuft in jedem modernen Browser (kein lokaler Dateizugriff nötig).
   - JEDE Datenänderung läuft durch mutate() → persist(): optimistisch sofort
     anzeigen, dann POST /api/mutate an den Server. Der Server serialisiert die
     Schreibvorgänge (SQLite) und meldet Konflikte zurück (Compare-and-Set).
   - Anzeige: der Server SCHIEBT Änderungen per SSE an alle Clients (connectSSE);
     kein Polling. refreshNow() = manueller Voll-Abgleich (🔄).
   - Die alte Datei-Schicht ist entfernt; der BACKEND-ADAPTER am Skriptende
     definiert readFile/persist/refreshNow/startLiveTimers/… als HTTP+SSE.

 UI-EINSTIEGSPUNKTE (Funktionsnamen zum Suchen)
   render()                        Raster (Kopf, Bereiche, Zellen)
   Sel / paintSel() / showCtx()    Auswahl: Ziehen, Shift+Klick, Pfeiltasten
   openBookingForm/submitBooking   Buchen inkl. Konflikte + Undo
   openBookingDetail               Buchung ansehen/löschen (Serien-Erkennung)
   openAssistant/runAssistant      gemeinsame freie Termine mehrerer Maschinen
   openMyBookings                  eigene Buchungen (Serienstruktur eingefroren)
   openAllBookings                 alle Buchungen, tabellarisch mit Filtern
   openStats                       Statistik Maschinen ⇄ Personen, Drilldown
   openAdmin/openMachineForm       Maschinenverwaltung + Änderungsprotokoll
   openSettings                    Theme, Präsenz, Ansicht, Name, Debug …
   gotoNextFree/gotoPrevFree       ⏭/⏮-Sprünge zum (nächsten) freien Termin
   connectSSE/applyPresence        Live-Verbindung + Anwesenheit (per SSE)
   dbg()/applyDebug()              Debug-Panel (Einstellungen → Debug)

 KONVENTIONEN
   - Datumswerte: intern Date auf UTC-Mitternacht, gespeichert/verglichen als
     ISO-String 'JJJJ-MM-TT' (Strings sortieren chronologisch korrekt).
   - Nur Werktage Mo–Fr; Wochenenden existieren im Raster nicht.
   - Namensvergleiche immer case-insensitiv (toLowerCase()).
   - Jede HTML-Ausgabe von Nutzdaten durch esc() schicken (XSS-Schutz).
   - Gerätebezogen = localStorage (Schlüssel mit Präfix mb_: user, theme,
     presence, compact, weekends, debug, favs, collapsed, machw);
     teamweit = Server (SQLite).

 ERWEITERN — CHECKLISTE
   1) Aktion, die Daten ändert: IMMER über mutate(); Undo via offerUndo().
   2) Neue Ansicht: eigenes Modal über openModal(), nicht in render() mischen.
   3) Neue Einstellung: openSettings() + localStorage + sofort anwenden.
   4) Versionsmarke am Dateiende hochzählen (/* vX.Y */).
=============================================================================
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maschinenbelegung ISF</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --border:#d8dbe0; --text:#1a1d21; --muted:#6b7280;
  --accent:#1a5fb4; --accent-light:#e8f0fb; --danger:#c0392b; --warn:#b9770e;
  --today:#fff8dc; --free-hover:#e8f5e9; --machw:230px;
  --hover:#f0f2f5; --headbg:#eceff3; --grpbg:#dde3ea; --cellbg:#fff;
  --todayhead:#f5e9b8; --blocked1:#f3f3f3; --blocked2:#e3e3e3;
  --tagbg:#eee; --tagink:#555; --dangerbg:#fde3e0; --warnbg:#fdf0d8;
  --confbg:#fdf3e7; --confink:#5c4a1f; --confbrd:#e6c78a;
  --toastbg:#333; --toastink:#fff; --accent-hover:#164e94;
  --focus:#e67e22; --selglow:rgba(26,95,180,.25);
  --dot-free:#2f9e44; --dot-busy:#e03131;
  --wknd:#e9ebef; --wkndhead:#dfe2e8; --wkndtint:rgba(110,116,128,.13);
  --star:#d4a017;
}
html[data-theme="dark"]{
  --bg:#15171a; --panel:#1e2126; --border:#3a3f46; --text:#e8eaed; --muted:#9aa0a6;
  --accent:#5b96e3; --accent-light:#263a52; --danger:#e07b6e; --warn:#d9a441;
  --today:#3a3620; --free-hover:#1f3320;
  --hover:#2a2f36; --headbg:#23262b; --grpbg:#2b313a; --cellbg:#1e2126;
  --star:#e0b84a;
  --todayhead:#4a4420; --blocked1:#24272c; --blocked2:#2f333a;
  --tagbg:#33383f; --tagink:#b6bcc4; --dangerbg:#4a2622; --warnbg:#453a1c;
  --confbg:#3b3325; --confink:#e8d9b0; --confbrd:#6b5c33;
  --toastbg:#e8eaed; --toastink:#1a1d21; --accent-hover:#6ea5e8;
  --focus:#ffab5e; --selglow:rgba(91,150,227,.32);
  --dot-free:#4cbf63; --dot-busy:#ff6b6b;
  --wknd:#242830; --wkndhead:#1b1e23; --wkndtint:rgba(150,160,180,.10);
}
body.compact td.cell{height:22px;padding:1px 4px;font-size:12px}
body.compact td.machcol{padding-top:1px;padding-bottom:1px;font-size:12px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font:14px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* ---------- Toolbar ---------- */
header{background:var(--panel);border-bottom:1px solid var(--border);padding:6px 12px 4px;display:grid;grid-template-columns:max-content 1fr max-content;row-gap:6px;column-gap:12px;align-items:center;position:sticky;top:0;z-index:30}
.l1{grid-column:1;grid-row:1;display:flex;gap:8px;align-items:center;justify-content:flex-start}
.l2{grid-column:1;grid-row:2;display:flex;gap:8px;align-items:center;justify-content:flex-start}
.r1{grid-column:3;grid-row:1;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.r2{grid-column:3;grid-row:2;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;min-width:300px}
.r2 .btn{width:100%;text-align:center}
#btnHelp{width:auto;padding:6px 10px} /* klein: nur Fragezeichen, die drei Hauptbuttons rücken auf */
#presBadge{font-size:10px;vertical-align:sub;color:var(--accent);margin-right:1px;cursor:default;font-weight:700}
header h1{font-size:16px;margin:0;white-space:nowrap;padding-left:13px} /* Emoji bündig mit Button-Beschriftung darunter */
/* Segmentierte Umschalter (Slider) in den Untermenüs: eine Einheit mit sicht-
   baren Trennern zwischen den Segmenten, gleichmäßige Größen, klare Zustände */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg.fill{display:flex}
.seg.fill button{flex:1}
.seg button{border:none;padding:6px 14px;min-height:32px;background:transparent;cursor:pointer;
  font-size:13px;font-weight:normal;line-height:1;color:var(--muted);white-space:nowrap;transition:background .12s,color .12s}
.seg button+button{border-left:1px solid var(--border)}
.seg button:hover{background:var(--hover);color:var(--text)}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on:hover{background:var(--accent);color:#fff}
.statrow.click{cursor:pointer}
.statrow.click:hover{background:var(--hover)}
@media (max-width:1000px){
  header{display:flex;flex-wrap:wrap}
  .l1,.l2{justify-content:flex-start}
  .r1,.r2{display:flex;min-width:0}
  .r1 .btn,.r2 .btn{width:auto}
}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:3px 8px;font-size:12px}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit;background:var(--panel);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-light);border-color:var(--accent)}
.navgroup{display:flex;gap:4px;align-items:center}
.spacer{flex:1}
#userChip{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600}
#lastRef{font-size:11px;color:var(--muted);white-space:nowrap}
#machWrap{position:relative}
#machDrop{display:none;position:absolute;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);padding:8px;z-index:60;min-width:320px}
#machDrop.open{display:block}
#machDrop label{display:block;padding:3px 6px;cursor:pointer;border-radius:4px;font-size:13px}
#machDrop label:hover{background:var(--hover)}
#machDrop .grp{font-weight:700;margin-top:6px;color:var(--muted);font-size:12px}
.chip{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent);border-radius:12px;padding:2px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{filter:brightness(.95)}
#groupWrap{position:relative}
#groupDrop{display:none;position:absolute;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);padding:8px;z-index:50;min-width:230px;max-height:320px;overflow:auto}
#groupDrop.open{display:block}
#groupDrop label{display:block;padding:4px 6px;cursor:pointer;border-radius:4px;font-size:13px}
#groupDrop label:hover{background:var(--hover)}
td.cell.booked.dim{opacity:.28;filter:grayscale(.8)}

/* ---------- Grid ---------- */
#gridWrap{flex:1;overflow:auto;position:relative}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0;font-size:13px}
thead th{background:var(--headbg);position:sticky;top:0;z-index:20;padding:4px 6px;font-weight:600;text-align:center;min-width:96px}
thead th.machcol{left:0;z-index:25;text-align:left;min-width:var(--machw);max-width:var(--machw);padding-left:12px}
thead th.gap{min-width:8px;background:var(--bg);border-bottom:none}
#colResize{position:absolute;top:0;right:-4px;bottom:0;width:8px;cursor:col-resize;z-index:27}
#colResize:hover{background:var(--accent-light)}
td.machcol{position:sticky;left:0;background:var(--panel);z-index:10;padding:4px 26px 4px 8px;min-width:var(--machw);max-width:var(--machw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.nextfree{position:absolute;right:3px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:12px;color:var(--accent);background:var(--panel);padding:1px 4px;border-radius:4px;border:1px solid var(--border);line-height:1.2}
.nextfree:hover{background:var(--accent-light)}
.nextfree.back{right:26px}
td.machcol.hasback{padding-right:49px}
td.gap{background:var(--bg);border-bottom:none}
/* Bereichszeilen kleben beim vertikalen Scrollen unter der Kopfzeile */
tr.grouprow td{background:var(--grpbg);font-weight:700;padding:5px 8px;cursor:pointer;border-bottom:1px solid var(--border);position:sticky;top:var(--theadh,47px);z-index:14}
tr.grouprow td:first-child{left:0;z-index:16;min-width:var(--machw);max-width:var(--machw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.grouprow td .arrow{display:inline-block;width:14px;transition:transform .1s}
tr.grouprow.collapsed td .arrow{transform:rotate(-90deg)}
/* Hauptkategorie-Zeile (Maschinen / Messtechnik) – gleicher Stil wie die
   Bereichs-Überschrift (grouprow), nur etwas kräftiger; ebenfalls einklappbar */
/* nicht vertikal kleben (sonst überlappt sie beim Scrollen die Bereichszeile);
   nur die erste Zelle bleibt horizontal fixiert, damit der Kategoriename beim
   Seitwärts-Scrollen sichtbar bleibt */
tr.grouprow.catrow td{font-weight:800;border-top:2px solid var(--border);position:static;top:auto}
tr.grouprow.catrow td:first-child{position:sticky;left:0;top:auto;z-index:15}
/* Kategorie-Umschalter im Spaltenkopf: „an" = im Raster aufgeklappt.
   Gleiche Bauweise wie die Slider unten (eine Einheit, sichtbare Trenner) */
.catseg{display:flex;justify-content:flex-start;gap:clamp(2px,1.5%,6px);width:100%;min-width:0}
.catseg .catbtn{flex:1 1 0;min-width:0;border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:6px 6px;cursor:pointer;font-size:13px;color:var(--text);font-weight:normal;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.catseg .catbtn>.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catseg .catbtn .ic{flex:0 0 auto}
.catseg .catbtn:hover{background:var(--hover)}
.catseg .catbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.catseg .catbtn.on:hover{background:var(--accent-hover)}
/* Einklappbare Gruppen in Checklisten (Assistent/Filter) und Statistik */
.grp.click,.statgrp.click{cursor:pointer;user-select:none}
.grp .arrow,.statgrp .arrow{display:inline-block;width:13px;transition:transform .1s;font-size:11px}
.grp.closed .arrow,.statgrp.closed .arrow{transform:rotate(-90deg)}
/* Hauptkategorie-Kopf in den Listen: wie die Bereichs-Überschrift im Raster
   (höhere Spezifität als „.mlist .grp", damit Farbe/Hintergrund gewinnen) */
.mlist .grp.cathead,.resultlist .statgrp.cathead,.grp.cathead,.statgrp.cathead{
  background:var(--grpbg);color:var(--text);text-transform:uppercase;
  letter-spacing:.05em;font-size:11px;font-weight:800;padding:5px 6px;border-radius:5px;margin-top:4px}
/* leichter grauer Trennstreifen zwischen den beiden Kategorien */
.mlist .grp.cathead:not(:first-child),.resultlist .statgrp.cathead:not(:first-child){
  border-top:6px solid var(--border);margin-top:10px;padding-top:9px}
/* Klappbaum im Filter-Dropdown: Dreieck, eingerückter Bereichs-Kopf, Geräte */
.mlist .grp.cathead.click{cursor:pointer}
.mlist .grpsub{font-weight:600;color:var(--muted);font-size:12px;padding:3px 4px 3px 16px;cursor:pointer;border-radius:4px}
.mlist .grpsub:hover,.mlist .grp.cathead.click:hover{background:var(--hover)}
.mlist label{padding-left:26px}
.tarr{display:inline-block;width:12px;font-size:9px;color:var(--muted);vertical-align:middle}
/* „Filter löschen": klar als Button erkennbar (Rahmen + Fläche), kein Toggle-Look */
.clearbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);
  background:var(--panel);color:var(--danger);font-weight:600;border-radius:7px;padding:5px 11px;min-height:30px}
.clearbtn:hover{background:var(--dangerbg);border-color:var(--danger)}
.clearbtn .ic{width:14px;height:14px}
td.cell{min-width:96px;max-width:150px;height:30px;cursor:pointer;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 4px;background:var(--cellbg)}
td.cell.free:hover{background:var(--free-hover)}
td.cell.today{background:var(--today)}
td.cell.booked{font-weight:500}
td.cell.mine{outline:2px solid var(--accent);outline-offset:-2px}
td.cell.blocked{background:repeating-linear-gradient(45deg,var(--blocked1),var(--blocked1) 6px,var(--blocked2) 6px,var(--blocked2) 12px);cursor:not-allowed;color:var(--muted)}
td.cell.unavail{background:var(--blocked1);cursor:not-allowed;color:var(--muted);opacity:.6}
th.today{background:var(--todayhead)}
/* Wochenend-Spalten dezent grau markieren (ganze Spalte) */
thead th.wknd{background:var(--wkndhead)}
td.cell.free.wknd{background:var(--wknd)}
td.cell.free.wknd:hover{background:var(--free-hover)}
td.cell.booked.wknd, td.cell.blocked.wknd{box-shadow:inset 0 0 0 999px var(--wkndtint)}
th.today.wknd{background:var(--todayhead)} /* heute schlägt Wochenende */
td.cell.today.wknd{background:var(--today)}
#grid{user-select:none}
td.cell.sel{box-shadow:inset 0 0 0 999px var(--selglow)}
td.cell.kfocus{outline:2px solid var(--focus);outline-offset:-2px}
/* Status-Punkt: echte CSS-Kreise statt Emoji (skalieren sauber, themefähig) */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.free{background:var(--dot-free)}
.dot.busy{background:var(--dot-busy)}
.dot.block{background:var(--warn);border-radius:2px}
.dot.unavail{background:transparent;border:2px solid var(--muted);box-sizing:border-box}
.statdot{display:inline-block;line-height:0;margin-right:4px;vertical-align:-2px}
.statdot .ic{width:13px;height:13px}
.statdot.maint{color:var(--warn)}
.statdot.broken{color:var(--dot-busy)}
/* Inline-SVG-Icons: einheitlicher 13-px-Strichsatz in currentColor */
.ic{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.favstar{cursor:pointer;margin-right:3px;color:var(--star);font-size:13px;opacity:.25;transition:opacity .12s}
.favstar.fav, tbody tr:hover .favstar{opacity:1}
.favstar:hover{transform:scale(1.25);display:inline-block}
/* Zeilen-Hover: Zeile unter dem Cursor hervorheben (hilft beim Verfolgen über viele Spalten) */
tbody tr:not(.grouprow):hover td.cell{filter:brightness(.95)}
tbody tr:not(.grouprow):hover td.machcol{background:var(--hover)}
/* Im Dark Mode aufhellen statt abdunkeln, sonst unsichtbar */
html[data-theme="dark"] tbody tr:not(.grouprow):hover td.cell{filter:brightness(1.35)}
/* Sprung-Knöpfe erst beim Überfahren der Zeile zeigen (weniger visuelles Rauschen) */
.nextfree{opacity:0;transition:opacity .12s}
tbody tr:hover .nextfree, .nextfree.back{opacity:1}
/* Dezente Scrollbalken (Chrome/Edge) */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
::-webkit-scrollbar-track{background:transparent}
#presBadge:hover{background:var(--panel)} /* passiv, kein Button-Hover */
.gcount{font-size:11px;font-weight:400;color:var(--muted);opacity:.7;margin-left:4px}
/* Kollisionsbanner: bleibt stehen, bis der Nutzer es wegklickt */
#collBanner{display:none;background:var(--dangerbg);color:var(--danger);border-bottom:1px solid var(--danger);padding:6px 12px;font-size:13px;align-items:center;gap:10px}
#collBanner.show{display:flex}
/* Eigener Bestätigungsdialog für destruktive Aktionen (statt native confirm()) */
#confirm2{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:250;align-items:center;justify-content:center;padding:16px}
#confirm2.open{display:flex}
#confirm2 .cbox{background:var(--panel);border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.35);max-width:460px;width:100%;padding:16px 18px}
#confirm2 h3{margin:0 0 8px;font-size:15px}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}
.statgrp{font-weight:700;padding:6px 6px 2px;font-size:12px;color:var(--muted);border-bottom:2px solid var(--border)}
#ctxMenu{position:fixed;z-index:150;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.2);padding:6px;display:none;min-width:200px}
#ctxMenu button{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text)}
#ctxMenu button:hover{background:var(--hover)}
.machinfo{color:var(--muted);cursor:pointer}
/* ---------- Assistent: Bedarfs-Baukasten (Drag & Drop) ---------- */
.aswork{border:1px dashed var(--border);border-radius:10px;padding:8px;min-height:54px;margin:6px 0;background:var(--panel)}
.aswork.dragover-root{border-color:var(--accent);background:var(--accent-light)}
.aswork .catlbl{font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:6px 2px 3px}
.asnode{border-radius:8px}
.asdev{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;margin:3px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:grab;font-size:13px}
.asdev:active{cursor:grabbing}
.asdev.dragging,.asgrp.dragging{opacity:.45}
.asdev.dragover{outline:2px solid var(--accent);outline-offset:1px}
.asdev .rm,.asgrp .rm{cursor:pointer;color:var(--muted);font-weight:700;line-height:1;padding:0 2px}
.asdev .rm:hover,.asgrp .rm:hover{color:var(--danger,#c0392b)}
.asdev .machinfo{display:inline-flex}
.asgrp{border:2px solid var(--border);border-radius:10px;padding:5px 7px 7px;margin:5px 3px;background:var(--panel)}
.asgrp.dragover{outline:2px solid var(--accent);outline-offset:1px}
.asgrp-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:2px;cursor:grab}
.asgrp-head b{color:var(--text)}
.asgrp-need{display:inline-flex;align-items:center;gap:2px}
.asgrp-need input{width:42px;text-align:center}
.asstep{border:1px solid var(--border);background:var(--panel);border-radius:6px;width:22px;height:22px;line-height:1;cursor:pointer;color:var(--text);font-weight:700}
.asstep:hover{background:var(--hover)}
.asgrp-kids{display:flex;flex-wrap:wrap;align-items:flex-start;min-height:30px;padding:2px;border-radius:6px}
.asgrp-kids.dragover{background:var(--accent-light)}
#modalReopen{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:90;display:none;flex-direction:column;align-items:center;gap:3px;background:var(--accent);color:#fff;border:none;border-radius:0 12px 12px 0;padding:12px 8px;box-shadow:0 4px 18px rgba(0,0,0,.28);cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.02em}
#modalReopen.show{display:flex}
#modalReopen .ic{width:18px;height:18px;stroke:#fff}
#modalReopen span{writing-mode:vertical-rl}
#asTip{position:fixed;z-index:300;display:none;max-width:220px;background:var(--text);color:var(--panel);padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.35;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none}
#asTip.show{display:block}
#asTip::after{content:"";position:absolute;left:var(--tipx,20px);bottom:-5px;border:5px solid transparent;border-top-color:var(--text);border-bottom:0}

/* ---------- Modal ---------- */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:100;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
#overlay.open{display:flex}
#modal{background:var(--panel);border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.25);max-width:640px;width:100%;padding:18px 20px;max-height:85vh;overflow:auto}
#modal h2{margin:0 0 12px;font-size:16px}
.formrow{display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap}
.formrow label{min-width:90px;font-size:13px;color:var(--muted)}
.formrow input[type=text],.formrow textarea{flex:1;min-width:160px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.hint{font-size:12px;color:var(--muted);margin:6px 0}
.conflictbox{background:var(--confbg);color:var(--confink);border:1px solid var(--confbrd);border-radius:6px;padding:8px;font-size:12px;margin:8px 0;max-height:120px;overflow:auto}
.mlist{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:6px;margin:6px 0}
.mlist label{display:block;padding:3px 4px;cursor:pointer;border-radius:4px}
.mlist label:hover{background:var(--hover)}
.mlist .grp{font-weight:700;margin-top:6px;color:var(--muted);font-size:12px}
.resultlist{max-height:300px;overflow:auto}
.resultlist .res{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid var(--border)}
.mybk{display:flex;justify-content:space-between;align-items:flex-start;padding:8px;border-bottom:1px solid var(--border);gap:8px}
.mybk .abmach{font-size:14px;line-height:1.35}
.mybk .abdate{font-size:13px;line-height:1.5;margin:1px 0}
.mybk .btn.small{flex:0 0 auto;margin-top:2px}
.abfilters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 6px}
.abfilters .fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.abfilters .fld>label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;min-width:auto;font-weight:600}
.abfilters .fld input,.abfilters .fld select{width:100%}
.daylist{margin-left:26px;border-left:2px solid var(--accent-light)}
.statrow{display:flex;align-items:center;gap:8px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:12px}
.statrow .nm{flex:0 0 210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statbar{flex:1;background:var(--headbg);border-radius:4px;height:14px;overflow:hidden}
.statbar div{height:100%;background:var(--accent)}
.statrow .pct{width:100px;text-align:right;white-space:nowrap}
.admrow{display:flex;gap:6px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--border)}
.admrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow{font-size:12px;padding:3px 6px;border-bottom:1px solid var(--border)}
.logrow .ts{color:var(--muted);margin-right:8px}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--tagbg);color:var(--tagink)}
.tag.defekt{background:var(--dangerbg);color:var(--danger)}
.tag.wartung{background:var(--warnbg);color:var(--warn)}

/* ---------- Debug-Panel ---------- */
#dbgPanel{position:fixed;top:92px;right:8px;width:340px;max-height:70vh;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:90;display:none;flex-direction:column;font-size:11px}
#dbgPanel.open{display:flex}
#dbgHead{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:700;font-size:12px}
#dbgList{overflow:auto;padding:4px 8px;font-family:Consolas,Menlo,monospace}
.dbgrow{padding:2px 0;border-bottom:1px dashed var(--border);word-break:break-word}
.dbgrow .t{color:var(--muted);margin-right:6px}
.dbgrow.err{color:var(--danger)}
.dbgrow.write{color:var(--accent)}
.dbgrow.remote{color:var(--warn)}
.dbgrow.latency{color:var(--accent);font-weight:600}

/* ---------- Start screen / Toast ---------- */
#startScreen{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center}
#startScreen .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:500px;text-align:center}
#startScreen h1{font-size:20px;margin:0 0 8px}
#startScreen p{color:var(--muted);font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--toastbg);color:var(--toastink);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;z-index:300;pointer-events:none}
#toast.show{opacity:1}
#toast.action{pointer-events:auto}
#toast button{margin-left:12px;background:var(--toastink);color:var(--toastbg);border:none;border-radius:6px;padding:3px 10px;cursor:pointer;font-weight:600;font-size:12px}
@media (max-width:700px){
  thead th.machcol,td.machcol{min-width:140px;max-width:150px;font-size:12px}
  header h1{display:none}
}
</style>
</head>
<body>

<!-- Icon-Sprite: schlichter 13-px-Strichsatz, ersetzt das frühere Emoji-System -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-factory" viewBox="0 0 16 16"><path d="M2 13.5V8.5l3-2v2l3-2v2l3-2V4.5h3v9z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 16 16"><path d="M9 1.5 4 9h3.2l-1 5.5L12 7H8.3z"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 16 16"><path d="M2.5 12a5.5 5.5 0 1 1 11 0"/><path d="M8 12 10.8 7.2"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.7-3.75M13 2.5V5h-2.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 16 16"><circle cx="8" cy="5.2" r="2.6"/><path d="M2.8 13.5a5.2 5.2 0 0 1 10.4 0"/></symbol>
  <symbol id="i-compass" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M10.5 5.5 9.2 9.2 5.5 10.5l1.3-3.7z"/></symbol>
  <symbol id="i-clip" viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="9" height="11.5" rx="1"/><path d="M6 6.5h4M6 9h4M6 11.5h2.5"/></symbol>

  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4"/><path d="m10.2 10.2 3.3 3.3"/></symbol>
  <symbol id="i-chart" viewBox="0 0 16 16"><path d="M3.5 13V9M7.5 13V4.5M11.5 13V7M2 13.5h12"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 16 16"><path d="M11.5 2.5a3 3 0 0 0-2.9 3.8L3 11.9a1.6 1.6 0 1 0 2.3 2.3l5.6-5.6a3 3 0 0 0 3.6-4.1L12.3 6.7l-2-.5-.5-2z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6 5 5M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4"/></symbol>

  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S4 3.8 8 3.8 14.5 8 14.5 8 12 12.2 8 12.2 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.9"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.3 4.5V3h3.4v1.5M4.5 4.5l.7 9h5.6l.7-9M6.6 7v4.5M9.4 7v4.5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10" rx="1"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 5a1.5 1.5 0 0 1 1.5-1.5h3L8 5.5h4.5A1.5 1.5 0 0 1 14 7v4.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></symbol>

<div id="startScreen">
  <div class="card">
    <h1>Maschinenbelegung ISF</h1>
    <p id="startMsg">Verbinde mit dem Server…</p>
  </div>
</div>

<header style="display:none" id="toolbar">
  <div class="l1">
    <h1><svg class="ic" aria-hidden="true"><use href="#i-factory"/></svg> Maschinenbelegung</h1>
    <div class="navgroup">
      <button class="btn" id="btnPrev" title="Vorherige Woche">◀</button>
      <button class="btn primary" id="btnToday">Heute</button>
      <button class="btn" id="btnNext" title="Nächste Woche">▶</button>
      <select id="jumpMonth" title="Zu Monat springen">
        <option value="0">Januar</option><option value="1">Februar</option><option value="2">März</option>
        <option value="3">April</option><option value="4">Mai</option><option value="5">Juni</option>
        <option value="6">Juli</option><option value="7">August</option><option value="8">September</option>
        <option value="9">Oktober</option><option value="10">November</option><option value="11">Dezember</option>
      </select>
      <input type="number" id="jumpYear" min="20" max="99" style="width:52px" title="Jahr (zweistellig, z. B. 26 = 2026)">
    </div>
    <div id="groupWrap" style="display:none">
      <button class="btn" id="groupBtn">Alle Bereiche ▾</button>
      <div id="groupDrop"></div>
    </div>
  </div>
  <div class="r1">
    <button class="btn small" id="btnRefresh" title="Jetzt neu laden (Zeit = letzter Datenabgleich)" aria-label="Jetzt neu laden"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg> <span id="lastRef">–</span></button>
    <button class="btn" id="userChip" title="Namen ändern" aria-label="Namen ändern">–</button>
  </div>
  <div class="l2">
    <button class="btn" id="btnAssist"><svg class="ic" aria-hidden="true"><use href="#i-compass"/></svg> Assistent</button>
    <button class="btn" id="btnMine"><svg class="ic" aria-hidden="true"><use href="#i-clip"/></svg> Meine Buchungen</button>
    <button class="btn" id="btnAll"><svg class="ic" aria-hidden="true"><use href="#i-table"/></svg> Alle Buchungen</button>
    <div id="machWrap">
      <button class="btn" id="machBtn"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg> Filtern ▾</button>
      <div id="machDrop"></div>
    </div>
  </div>
  <div class="r2">
    <button class="btn" id="btnStats"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg> Statistik</button>
    <button class="btn" id="btnAdmin"><svg class="ic" aria-hidden="true"><use href="#i-wrench"/></svg> Verwalten</button>
    <button class="btn" id="btnSettings"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg> Einstellungen</button>
    <button class="btn" id="btnHelp" title="Legende und Tastaturkürzel" aria-label="Hilfe"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg></button>
  </div>
</header>

<div id="collBanner" role="alert">
  <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>
  <span>Gleichzeitiger Schreibzugriff erkannt – der Plan wurde soeben mit dem Stand der Kollegen neu geladen. Bitte letzte Aktion prüfen.</span>
  <span class="spacer"></span>
  <button class="btn small" id="collOk">Verstanden</button>
</div>
<div id="gridWrap" style="display:none" tabindex="0" role="application"
  aria-label="Belegungsraster: Pfeiltasten navigieren, Shift erweitert die Auswahl, Enter öffnet, Escape hebt auf">
  <table id="grid" role="grid" aria-label="Belegungsraster"><thead></thead><tbody></tbody></table></div>

<div id="overlay"><div id="modal" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<button id="modalReopen" title="Assistent wieder aufklappen" aria-label="Assistent wieder aufklappen"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg><span>Assistent</span></button>
<div id="asTip" role="status" aria-live="polite"></div>
<div id="confirm2" role="dialog" aria-modal="true">
  <div class="cbox">
    <h3 id="cfTitle"></h3>
    <div id="cfBody" style="font-size:13px"></div>
    <div class="modal-actions">
      <button class="btn" id="cfNo">Abbrechen</button>
      <button class="btn dangerfill" id="cfYes">Löschen</button>
    </div>
  </div>
</div>
<div id="ctxMenu"></div>
<div id="dbgPanel">
  <div id="dbgHead"><svg class="ic" aria-hidden="true"><use href="#i-bug"/></svg> Debug
    <span class="spacer"></span>
    <button class="btn small" id="dbgClear">Leeren</button>
    <button class="btn small" id="dbgClose" title="Debug-Modus ausschalten">✕</button>
  </div>
  <div id="dbgList"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/legacy.js"></script>
</body>
</html>
