# Development toolchain — NOT for production (prod stays in docker-compose.yml).
# Node lives only in this container; the Windows host needs no Node install.
#
#   Install deps:   docker compose -f docker-compose.dev.yml run --rm dev npm install
#   Run tests:      docker compose -f docker-compose.dev.yml run --rm dev npm test
#   Type-check:     docker compose -f docker-compose.dev.yml run --rm dev npm run check
#   Vite dev server:docker compose -f docker-compose.dev.yml run --rm --service-ports dev npm run dev
#
services:
  dev:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app                      # source is bind-mounted (host edits are live)
      - node_modules:/app/node_modules  # deps stay in the Linux VM (fast, correct native bins)
    environment:
      - CHOKIDAR_USEPOLLING=true     # reliable file-watching across the Windows->container boundary
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach the backend published on the host (:3000)
    ports:
      - "5173:5173"                  # Vite dev server (published only with --service-ports)

volumes:
  node_modules:
